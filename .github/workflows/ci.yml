name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: caliburn_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d caliburn_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      CALIBURN_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/caliburn_test
      CALIBURN_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/caliburn_test
      CALIBURN_PROVIDER: fixture
      CALIBURN_API_TOKEN: ci-fixture-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests migrations scripts
      - run: ruff format --check src tests migrations scripts
      - run: node --test tests/timeline_stream.test.mjs
      - run: docker build --file deploy/sandbox/Dockerfile --tag caliburn-sandbox:ci .
      - run: echo "CALIBURN_SANDBOX_TEST_IMAGE=$(docker image inspect caliburn-sandbox:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: docker build --file deploy/sandbox/Dockerfile.tests --tag caliburn-sandbox:tests-ci .
      - run: echo "CALIBURN_REVIEWED_TEST_IMAGE=$(docker image inspect caliburn-sandbox:tests-ci --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: pytest -q
      - run: alembic upgrade head
      - run: python scripts/demo_runtime.py
      - run: python scripts/demo_workspace.py --image "$CALIBURN_SANDBOX_TEST_IMAGE"
      - run: python scripts/demo_task_checkout.py --image "$CALIBURN_SANDBOX_TEST_IMAGE"
